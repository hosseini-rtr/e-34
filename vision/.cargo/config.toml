[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --baud 921600"
rustflags = ["-C", "default-linker-libraries"]

[unstable]
build-std = ["std", "panic_abort", "core", "alloc"]

[profile.release]
opt-level = "s" # "s" or "z"
lto = "thin"    # "thin" is more reliable on Xtensa than "fat"
panic = "abort" # keep this if you want abort
